spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/margindb
    username: sysuser
    password: admin123
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    clean-disabled: true

storage:
  type: local
  local:
    upload-dir: ${user.home}/margin/uploads
    base-url: ${APP_BASE_URL:http://localhost:8080}/api/files
  s3:
    endpoint: http://localhost:9000
    region: eu-central-1
    bucket-name: margin-profile-pictures
    access-key: minioadmin
    secret-key: minioadmin

jwt:
  secret: dev-secret-key-not-for-production-use-only

mediasoup:
  url: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      access: unrestricted
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
  server:
    port: 9090