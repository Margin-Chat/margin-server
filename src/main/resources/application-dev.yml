margin:
  app:
    base-url: http://localhost:5173
  mail:
    from: ${MAIL_FROM:localhost@margin.chat}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176

spring:
  threads:
    virtual:
      enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  datasource:
    url: jdbc:postgresql://localhost:5433/margindb
    username: sysuser
    password: admin123
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    clean-disabled: true

storage:
  type: local
  local:
    upload-dir: ${user.home}/margin/uploads
    base-url: ${APP_BASE_URL:http://localhost:8080}/api/files
  s3:
    endpoint: http://localhost:9000
    region: eu-central-1
    bucket-name: margin-profile-pictures
    access-key: minioadmin
    secret-key: minioadmin

jwt:
  secret: dev-secret-key-not-for-production-use-only

sfu:
  url: http://localhost:3000
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-not-for-production-use-only}
  token-secret: ${SFU_SECRET:dev-secret-sfu-key-not-for-production-use-only}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      access: unrestricted
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
  server:
    port: 9090