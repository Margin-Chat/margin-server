# application-dev.properties - for local IntelliJ development
spring.datasource.url=jdbc:postgresql://localhost:5433/margindb
spring.datasource.username=sysuser
spring.datasource.password=admin123
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

jwt.secret=dev-secret-key-not-for-production-use-only

# Optional: disable flyway clean for safety
spring.flyway.clean-disabled=true