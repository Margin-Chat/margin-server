<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Inter',Arial,sans-serif">

  <div style="max-width:520px;margin:40px auto;padding:0 16px">

    <div style="padding:28px 0 20px;text-align:center">
      <img th:if="${logoUrl != null}" th:src="${logoUrl}" src=""
           alt="margin" style="height:32px;width:auto"/>
      <span th:unless="${logoUrl != null}"
            style="font-size:20px;font-weight:700;color:#2d2d2d;letter-spacing:-0.5px">margin</span>
    </div>

    <div style="background:#fff;border:1px solid #ebebeb;border-radius:12px;overflow:hidden">

      <div style="height:4px;background:#f47e3a"></div>

      <div style="padding:32px">
        <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#2d2d2d;letter-spacing:-0.3px">Payment receipt</h1>
        <p style="margin:0 0 28px;font-size:0.9rem;color:#666">
          Thanks for your payment, <span th:text="${ownerName}" style="color:#2d2d2d;font-weight:600">Alice</span>.
        </p>

        <table style="width:100%;border-collapse:collapse">
          <tr>
            <td style="padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:0.875rem;color:#888">Margin</td>
            <td style="padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:0.875rem;color:#2d2d2d;text-align:right;font-weight:500"
                th:text="${marginName}">ACME Corp</td>
          </tr>
          <tr>
            <td style="padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:0.875rem;color:#888">Plan</td>
            <td style="padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:0.875rem;text-align:right;font-weight:500">
              <span th:text="${tier}"
                    style="display:inline-block;padding:2px 10px;background:rgba(244,126,58,0.1);color:#f47e3a;border-radius:999px;font-size:0.8rem;font-weight:600">
                SMALL
              </span>
            </td>
          </tr>
          <tr>
            <td style="padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:0.875rem;color:#888">Amount paid</td>
            <td style="padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:0.875rem;color:#2d2d2d;text-align:right;font-weight:700"
                th:text="${currency + ' ' + amount}">EUR 9.99</td>
          </tr>
          <tr>
            <td style="padding:11px 0;font-size:0.875rem;color:#888">Next billing date</td>
            <td style="padding:11px 0;font-size:0.875rem;color:#2d2d2d;text-align:right;font-weight:500"
                th:text="${nextBillingDate}">13 Jun 2026</td>
          </tr>
        </table>
      </div>

      <div style="padding:16px 32px 24px;border-top:1px solid #f0f0f0">
        <p style="margin:0;font-size:0.75rem;color:#aaa">
          Payment reference: <span th:text="${paymentId}" style="font-family:monospace">tr_abc123</span>
        </p>
      </div>

    </div>

    <p style="text-align:center;font-size:0.75rem;color:#bbb;margin:20px 0 0">
      &copy; margin
    </p>

  </div>
</body>
</html>
