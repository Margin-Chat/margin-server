<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Inter',Arial,sans-serif">

  <div style="max-width:520px;margin:40px auto;padding:0 16px">

    <div style="padding:28px 0 20px;text-align:center">
      <img th:if="${logoUrl != null}" th:src="${logoUrl}" src=""
           alt="margin" style="height:32px;width:auto"/>
      <span th:unless="${logoUrl != null}"
            style="font-size:20px;font-weight:700;color:#2d2d2d;letter-spacing:-0.5px">margin</span>
    </div>

    <div style="background:#fff;border:1px solid #ebebeb;border-radius:12px;overflow:hidden">

      <div style="height:4px;background:#f47e3a"></div>

      <div style="padding:32px">
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;color:#2d2d2d;letter-spacing:-0.3px"
            th:text="'Hi ' + ${displayName} + ','">Hi Alice,</h1>
        <p style="margin:0 0 28px;font-size:0.9rem;color:#666;line-height:1.5">
          We received a request to reset your password. Click the button below to choose a new one.
          This link expires in 1 hour.
        </p>
        <a th:href="${resetUrl}" href="#"
           style="display:inline-block;padding:12px 28px;background:#2d2d2d;color:#fff;text-decoration:none;border-radius:8px;font-size:0.875rem;font-weight:600;letter-spacing:0.01em">
          Reset password
        </a>
      </div>

      <div style="padding:16px 32px 24px;border-top:1px solid #f0f0f0">
        <p style="margin:0;font-size:0.75rem;color:#aaa;line-height:1.5">
          If you didn't request a password reset, you can safely ignore this email.
          Your password won't change.
        </p>
      </div>

    </div>

    <p style="text-align:center;font-size:0.75rem;color:#bbb;margin:20px 0 0">
      &copy; margin
    </p>

  </div>
</body>
</html>
