spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/margin_test
    username: sysuser
    password: admin123
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

margin:
  mail:
    from: ${MAIL_FROM:localhost@margin.chat}
  websocket:
    port: 8082
  jwt:
    secret: integration-test-secret-that-is-long-enough
  rate-limit:
    conversation-image-upload:
      capacity: 20
      refill-period: PT1H

storage:
  type: local