spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:test}
    password: ${SMTP_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

websocket:
  port: 0

margin:
  meetings:
    guest-token-secret: integration-guest-token-secret-that-is-long-enough
  mail:
    from: ${MAIL_FROM:localhost@margin.chat}
    log-only: true
  websocket:
    port: 8082

jwt:
  secret: integration-test-secret-that-is-long-enough

storage:
  type: local
  s3:
    endpoint: http://localhost:9000
    access-key: integration-test-access-key
    secret-key: integration-test-secret-key
    base-url: http://localhost:8080/api/files
  local:
    upload-dir: ${java.io.tmpdir}/margin-integration-uploads
    base-url: http://localhost:8080/api/files

sfu:
  url: http://localhost:3000
  public-url: ws://localhost:3000
  internal-api-key: integration-test-internal-api-key
  token-secret: integration-sfu-secret-that-is-long-enough

mollie:
  api-key: test_integrationdummymolliekey
  webhook-base-url: http://localhost:8080
  redirect-base-url: http://localhost:4173
