spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

websocket:
  port: 0

margin:
  mail:
    from: ${MAIL_FROM:localhost@margin.chat}
    log-only: true
  websocket:
    port: 8082
  jwt:
    secret: integration-test-secret-that-is-long-enough

storage:
  type: local
  local:
    upload-dir: ${java.io.tmpdir}/margin-integration-uploads
    base-url: http://localhost:8080/api/files