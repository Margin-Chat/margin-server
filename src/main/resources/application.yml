margin:
  meetings:
    guest-token-secret: ${MEETING_GUEST_TOKEN_SECRET}
  app:
    base-url: https://margin.chat
  mail:
    from: ${MAIL_FROM:noreply@margin.chat}
  cors:
    allowed-origins: https://margin.chat,app://

spring:
  application:
    name: margin-server
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 200
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true

  flyway:
    clean-disabled: true

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:5184000000}

storage:
  type: ${STORAGE_TYPE}
  s3:
    endpoint: ${HETZNER_S3_ENDPOINT}
    region: eu-central
    bucket-name: margin
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    base-url: ${APP_BASE_URL}/api/files
    cdn-base-url: https://files.margin.chat
    presign-ttl-seconds: 21600
  local:
    upload-dir: /var/margin/uploads/profile-pictures
    base-url: ${APP_BASE_URL}/api/files

sfu:
  url: ${SFU_URL}
  public-url: ${SFU_PUBLIC_URL}
  internal-api-key: ${INTERNAL_API_KEY}
  token-secret: ${SFU_SECRET}
  token-expiration: 3600000

mollie:
  api-key: ${MOLLIE_API_KEY}
  api-base-url: https://api.mollie.com/v2
  webhook-base-url: ${MOLLIE_WEBHOOK_BASE_URL}
  redirect-base-url: ${MOLLIE_REDIRECT_BASE_URL}
  testmode: false

subscriptions:
  currency: EUR
  tiers:
    FREE:
      maxMembers: 10
      maxStorageGb: 0
      maxCallParticipants: 5
    SMALL:
      price: 9.99
      maxMembers: 25
      maxStorageGb: 50
      maxCallParticipants: 10
    MEDIUM:
      price: 29.99
      maxMembers: 200
      maxStorageGb: 100
      maxCallParticipants: 25

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: unrestricted
  server:
    port: 9090
push:
  fcm:
    service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:}
  apns:
    key-file: ${APNS_KEY_FILE:}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    bundle-id: ${APNS_BUNDLE_ID:}
    production: ${APNS_PRODUCTION:false}
