margin:
  app:
    base-url: https://margin.chat
  mail:
    from: ${MAIL_FROM:noreply@margin.chat}
  cors:
    allowed-origins: https://margin.chat,app://

spring:
  application:
    name: margin-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/margindb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 200
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true

  flyway:
    clean-disabled: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-not-for-production-use-only}
  expiration: 604800000

storage:
  type: ${STORAGE_TYPE:s3}
  s3:
    endpoint: ${HETZNER_S3_ENDPOINT}
    region: eu-central
    bucket-name: margin
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    base-url: https://files.margin.chat
    presign-ttl-seconds: 600
  local:
    upload-dir: /var/margin/uploads/profile-pictures
    base-url: ${APP_BASE_URL}/api/files

sfu:
  url: ${SFU_URL:http://localhost:3000}
  public-url: ${SFU_PUBLIC_URL:ws://localhost:3000}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-not-for-production-use-only}
  token-secret: ${SFU_SECRET:dev-secret-sfu-key-not-for-production-use-only}
  token-expiration: 3600000

mollie:
  api-key: ${MOLLIE_API_KEY}
  api-base-url: https://api.mollie.com/v2
  webhook-base-url: ${MOLLIE_WEBHOOK_BASE_URL:http://localhost:8080}
  redirect-base-url: ${MOLLIE_REDIRECT_BASE_URL:http://localhost:4173}
  testmode: false

subscriptions:
  currency: EUR
  tiers:
    FREE:
      maxMembers: 10
      maxStorageGb: 0
      maxCallParticipants: 5
    SMALL:
      price: 9.99
      maxMembers: 25
      maxStorageGb: 50
      maxCallParticipants: 10
    MEDIUM:
      price: 29.99
      maxMembers: 200
      maxStorageGb: 100
      maxCallParticipants: 25

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: unrestricted
  server:
    port: 9090