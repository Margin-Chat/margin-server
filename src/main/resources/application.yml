spring:
  application:
    name: margin-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/margindb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  threads:
    virtual:
      enabled: true

  flyway:
    clean-disabled: true

margin:
  cors:
    allowed-origins: https://margin.chat,://file

jwt:
  secret: ${JWT_SECRET:dev-secret-key-not-for-production-use-only}
  expiration: 604800000

storage:
  type: ${STORAGE_TYPE:s3}
  s3:
    endpoint: ${HETZNER_S3_ENDPOINT}
    region: eu-central
    bucket-name: margin
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  local:
    upload-dir: /var/margin/uploads/profile-pictures
    base-url: ${APP_BASE_URL}/api/files

sfu:
  url: ${SFU_URL:http://localhost:3000}
  public-url: ${SFU_PUBLIC_URL:ws://localhost:3000}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-not-for-production-use-only}
  token-secret: ${SFU_SECRET:dev-secret-sfu-key-not-for-production-use-only}
  token-expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: unrestricted
  server:
    port: 9090