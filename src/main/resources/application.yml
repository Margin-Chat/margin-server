spring:
  application:
    name: margin-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/margindb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    clean-disabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

storage:
  type: ${STORAGE_TYPE:s3}
  s3:
    endpoint: ${HETZNER_S3_ENDPOINT}
    region: eu-central-1
    bucket-name: margin-profile-pictures
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  local:
    upload-dir: /var/margin/uploads/profile-pictures
    base-url: ${APP_BASE_URL}/api/files

mediasoup:
  url: ${MEDIASOUP_URL:http://localhost:3000}